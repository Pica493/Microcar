<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mini Racers</title>
<script src="https://yandex.ru/games/sdk/v2" onerror="console.warn('Yandex SDK not available')"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,sans-serif;user-select:none;color:#fff;touch-action:none}
#game{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;display:none;z-index:100;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
#ui.active{display:block}
.panel{max-width:720px;width:calc(100% - 32px);margin:20px auto;padding-bottom:40px;text-align:center}
.title{font-size:clamp(32px,8vw,56px);font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#ff7676,#ffce54,#7ee8a2,#66c2ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}
.subtitle{opacity:.65;margin-bottom:20px;font-size:15px}
.coinBar{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:20px;background:rgba(241,196,15,.12);border:1px solid rgba(241,196,15,.35);margin-bottom:16px;font-weight:800;color:#f1c40f;font-size:16px}
.coinBar::before{content:'💰';font-size:18px}
.btn{display:block;width:100%;padding:15px 24px;margin:8px 0;background:#2a3142;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97);background:#3a4258}
.btn.primary{background:linear-gradient(180deg,#4f8ef7,#2a6cd6);border-color:#4f8ef7}
.btn.gold{background:linear-gradient(180deg,#f5c542,#d99e07);border-color:#f5c542;color:#1a1a1a}
.btn.green{background:linear-gradient(180deg,#2ecc71,#229954);border-color:#2ecc71}
.btn.red{background:linear-gradient(180deg,#e74c3c,#a02020);border-color:#e74c3c}
.btn.ad{background:linear-gradient(180deg,#c840a0,#8a2070);border-color:#c840a0}
.btn.small{padding:10px 16px;font-size:14px}
.stat{display:flex;justify-content:space-between;padding:12px 16px;margin:6px 0;background:rgba(255,255,255,.05);border-radius:10px;font-size:15px}
.stat b{color:#f1c40f}
.controls{margin-top:20px;opacity:.55;font-size:12px;line-height:1.8;text-align:left;padding:12px 16px;background:rgba(255,255,255,.04);border-radius:10px}
.controls b{color:#7ee8a2}
.trackGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:16px 0}

.trackCard:active{transform:scale(.96)}
.trackCard.no-action{cursor:default}
.trackCard.no-action:active{transform:none}
.trackCard.locked{opacity:.45;cursor:not-allowed}
.trackCard.locked:active{transform:none}
.trackCard.current{border-color:#4f8ef7;box-shadow:0 0 0 1px #4f8ef7 inset}
.trackCard .num{font-size:11px;opacity:.5;font-weight:800;letter-spacing:1px}
.trackCard .name{font-weight:800;font-size:16px;margin:4px 0}
.trackCard .best{font-size:12px;color:#f1c40f;font-weight:700}
.trackCard .desc{font-size:11px;color:rgba(255,255,255,.55);margin-top:4px;line-height:1.3}
.trackCard .lock{position:absolute;top:8px;right:10px;font-size:18px;opacity:.7}
.trackCard .price{font-size:13px;font-weight:800;color:#f1c40f;margin-top:6px}
.trackCard .price::before{content:'💰 '}
.trackCard .stars{font-size:16px;letter-spacing:2px;margin-top:4px;color:#f1c40f}
.trackCard .stars .empty{opacity:.25}
.colorRow{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.colorDot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.3);cursor:pointer;transition:transform .1s;position:relative}
.colorDot:active{transform:scale(.9)}
.colorDot.active{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.colorDot.preview{border-color:#f1c40f;box-shadow:0 0 0 2px #f1c40f}
.colorDot.locked::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.5);border-radius:50%}
.colorDot.locked::before{content:'🔒';position:absolute;inset:0;font-size:10px;display:flex;align-items:center;justify-content:center;z-index:1}
.buyRow{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.buyHint{font-size:11px;color:#f1c40f;flex:1;text-align:left}
.botRow{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:10px 0}
.botBtn{width:auto;display:inline-block;min-width:56px;padding:12px 18px;margin:0}
.statsBox{margin-top:8px;padding:8px;background:rgba(0,0,0,.3);border-radius:8px;border:1px solid rgba(255,255,255,.06)}
.statsTitle{font-size:10px;font-weight:800;letter-spacing:.6px;color:rgba(255,255,255,.45);margin-bottom:6px;text-align:left;text-transform:uppercase}
.statLine{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:11px}
.statLabel{width:80px;text-align:left;color:rgba(255,255,255,.7);flex-shrink:0;font-size:11px}
.statBarWrap{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.statBarFill{height:100%;background:linear-gradient(90deg,#7ee8a2,#4f8ef7);border-radius:3px;transition:width .25s}
.statBarFill.warn{background:linear-gradient(90deg,#f1c40f,#e67e22)}
.statVal{width:56px;text-align:right;font-weight:800;color:#f1c40f;flex-shrink:0;font-size:10px}
.sliderRow{display:flex;align-items:center;gap:10px;padding:12px 16px;margin:8px 0;background:rgba(255,255,255,.05);border-radius:10px;font-size:15px}
.sliderRow>span.volIcon{width:44px;text-align:center;flex-shrink:0;font-weight:700;position:relative;font-size:22px;line-height:1}
.sliderRow>span.volIcon.muted::after{content:'';position:absolute;left:8px;right:8px;top:50%;height:3px;background:#ff3b3b;transform:rotate(-40deg);transform-origin:center;border-radius:2px}
.sliderRow>span.volLabel{width:66px;text-align:left;flex-shrink:0;font-weight:700;font-size:14px}
.sliderRow>input[type=range]{flex:1;min-width:80px;height:6px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.15);border-radius:3px;outline:none;cursor:pointer}
.sliderRow>input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#4f8ef7;cursor:pointer;border:2px solid #fff}
.sliderRow>input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#4f8ef7;cursor:pointer;border:2px solid #fff}
.sliderRow>b{width:56px;text-align:right;color:#f1c40f;font-weight:800;font-size:14px;flex-shrink:0}
.bigStars{font-size:56px;letter-spacing:12px;margin:18px 0}
.bigStars .empty,.stars .empty{opacity:.2}
#touchLayer{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}
#touchLayer.active{display:block}
#stick{position:absolute;left:22px;bottom:22px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);pointer-events:auto}
#stickKnob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.4);border:2px solid rgba(255,255,255,.7)}
#gasBtn{position:absolute;right:22px;bottom:22px;width:86px;height:86px;border-radius:50%;background:rgba(80,220,120,.4);border:2px solid rgba(255,255,255,.6);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
#gasBtn.pressed{background:rgba(80,220,120,.75)}
#pauseBtn{position:fixed;top:10px;right:10px;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.35);color:#fff;font-size:18px;font-weight:900;cursor:pointer;z-index:60;display:none;align-items:center;justify-content:center;font-family:inherit}
#pauseBtn.show{display:flex}
#pauseBtn:active{transform:scale(.92)}
#adModal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.94);font-family:inherit;padding:20px}
#adModal.show{display:flex}
.adBox{background:#1a1f2e;border:2px solid #4f8ef7;border-radius:16px;padding:24px;max-width:420px;width:100%;text-align:center}
.adTitle{font-size:22px;font-weight:900;margin-bottom:14px;color:#4f8ef7}
.adProgress{height:14px;background:rgba(255,255,255,.15);border-radius:7px;overflow:hidden;margin:16px 0}
.adFill{height:100%;background:linear-gradient(90deg,#4f8ef7,#7ee8a2);width:0%;transition:width .15s linear}
.adReward{font-size:36px;font-weight:900;color:#f1c40f;margin:12px 0}
@media (orientation:landscape) and (max-height:520px){
  .panel{margin:8px auto;padding-bottom:16px;max-width:96%}
  .title{font-size:24px !important;margin-bottom:4px}
  .subtitle{font-size:12px;margin-bottom:10px}
  .coinBar{padding:4px 12px;font-size:13px;margin-bottom:8px}
  .btn{padding:9px 16px;font-size:13px;margin:4px 0;border-radius:10px}
  .btn.small{padding:6px 12px;font-size:11px}
  .trackGrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:8px 0}
  .trackCard{padding:8px;border-radius:8px}
  .trackCard .name{font-size:13px}
  .trackCard .desc{font-size:10px}
  .trackCard svg{height:70px !important}
  .stat{padding:8px 12px;font-size:13px;margin:4px 0}
  .controls{font-size:10px;padding:8px 12px;line-height:1.5}
  .sliderRow{padding:8px 12px;font-size:13px}
  .bigStars{font-size:38px;margin:10px 0}
  .botBtn{padding:8px 12px;min-width:44px;font-size:13px}

@media (min-width:1600px){.panel{max-width:1100px}.title{font-size:72px}.btn{padding:22px 36px;font-size:22px}.trackGrid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}.trackCard .name{font-size:20px}.controls{font-size:16px}}
@media (max-width:360px){.title{font-size:26px}.btn{padding:11px 16px;font-size:14px}.trackGrid{grid-template-columns:1fr 1fr;gap:6px}.trackCard .name{font-size:12px}}
</style>
</head>

  resolveObstacles(car,dt){
    for(const o of this.track.obstacles){
      if(o._used)continue;
      const dx=car.x-o.x,dy=car.y-o.y;const d=Math.hypot(dx,dy);
      if(o.type==='oil'){if(d<o.r){const k=Math.exp(-o.drag*dt);car.vx*=k;car.vy*=k;}continue;}
      const minD=CAR_R+o.r;
      if(d<minD&&d>0.01){
        const nx=dx/d,ny=dy/d,ov=minD-d;
        if(o._pushable){
          let newX=o.x-nx*ov*2.5;
          let newY=o.y-ny*ov*2.5;
          const safePos=this.track.clampToRoad(newX,newY,this.track.roadWidth*DEBRIS_ROAD_MARGIN);
          o.x=safePos.x;
          o.y=safePos.y;
          o.angle=(o.angle||0)+rand(-0.4,0.4);
          car.vx*=0.35;car.vy*=0.35;
          if(car.isPlayer||car.isPlayer2){this._shake=Math.min(1,this._shake+0.28);Audio.hit();}
          Particles.burst((car.x+o.x)/2,(car.y+o.y)/2,'#666',4,90);
          continue;
        }
        car.x+=nx*ov;car.y+=ny*ov;
        const vn=car.vx*nx+car.vy*ny;
        if(vn<0){
          car.vx-=vn*nx*o.bounce;car.vy-=vn*ny*o.bounce;
          if(car.isPlayer){this._shake=Math.min(1,this._shake+0.15);Audio.hit();}
          Particles.burst(car.x,car.y,o.type==='barrel'?'#ff8c00':'#aaa',5,130);
        }
      }
    }
  },
  resolveDestructibles(car){
    for(const d of this.track.destructibles){
      if(d.broken)continue;
      const dx=car.x-d.x,dy=car.y-d.y;const dd=Math.hypot(dx,dy);
      const minD=CAR_R+d.r;
      if(dd<minD&&dd>0.01){
        const nx=dx/dd,ny=dy/dd,ov=minD-dd;
        car.x+=nx*ov;car.y+=ny*ov;
        const vn=car.vx*nx+car.vy*ny;
        if(vn<0){
          car.vx-=vn*nx*0.4;car.vy-=vn*ny*0.4;
          if(Math.abs(vn)>60){
            d.broken=true;
            const k=0.72;car.vx*=k;car.vy*=k;
            Audio.crate();
            if(car.isPlayer)this._shake=Math.min(1,this._shake+0.12);
            const c=BREAKABLE_STYLES[this.track.breakableStyle]||BREAKABLE_STYLES.hay;
            for(let i=0;i<8;i++){const a=Math.random()*TAU,s=rand(60,180);Particles.add(d.x,d.y,Math.cos(a)*s,Math.sin(a)*s,rand(0.4,0.8),i%2===0?c.main:c.dark,rand(2,4));}

        }

    }
  },
  resolveProps(car){
    for(const p of this.track.props){
      const dx=car.x-p.x,dy=car.y-p.y;const d2=dx*dx+dy*dy;
      const r=CAR_R+p.r;if(d2>r*r)continue;
      let d=Math.sqrt(d2);let nx,ny;
      if(d<0.01){const a=Math.random()*TAU;nx=Math.cos(a);ny=Math.sin(a);d=0.01;}
      else{nx=dx/d;ny=dy/d;}
      const ov=r-d;car.x+=nx*ov;car.y+=ny*ov;
      const vn=car.vx*nx+car.vy*ny;
      if(vn<0){
        car.vx-=vn*nx*1.3;car.vy-=vn*ny*1.3;
        if(car.isPlayer&&Math.abs(vn)>100){this._shake=Math.min(1,this._shake+0.18);Audio.hit();Particles.burst(car.x,car.y,'#a07040',5,120);}

  resolveCarCollision(a,b){
    if(!a||!b)return;
    if(a.eliminated||b.eliminated)return;
    const dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy);const minD=CAR_R*2;

  onFinish(){this.state='finished';this.finishDelay=1.8;Audio.finish();},
  handleResults(){

      }

      Save.data.coins+=reward;Save.save();
      this._lastReward=reward;

    }
    if(this.mode==='battle'){

      const p1R=rankFor(p1),p2R=p2?rankFor(p2):0;

      Save.data.coins+=reward;Save.save();
      if(p1R===1||p2R===1){Save.data.battleWins=(Save.data.battleWins||0)+1;Save.save();}
      this._lastReward=reward;this._battleRank=p1R;
      UI.showResults(false,reward,0,p1R,p2?p2R:null);
      return;

  _drawBattleOverlay(ctx){

  _drawTimeOverlay(ctx){
    if(this.state!=='racing'&&this.state!=='countdown')return;

  drawHUD(ctx){
    if(!this.player)return;
    ctx.save();
    if(this.isMulti&&this.cars[1]){
      this._drawPlayerHUD(ctx,this.cars[0],10,'#e74c3c','P1');
      this._drawPlayerHUD(ctx,this.cars[1],this.viewW-160,'#3498db','P2');
    }else if(this.mode!=='time'&&this.mode!=='battle'){
      this._drawPlayerHUD(ctx,this.player,10,'#e74c3c','');
    }
    if(this.mode!=='time'&&this.mode!=='battle')this.drawMinimap(ctx);
    if(this.mode==='battle'&&this.cars.length){
      const aliveList = this._sortCars().filter(c=>!c.eliminated);
      const W=100,H=38,Y=6;
      const one=(p,x,color,label)=>{
        if(!p)return;
        ctx.fillStyle='rgba(0,0,0,0.78)';
        roundRect(ctx, x, Y, W, H, 8); ctx.fill();
        ctx.strokeStyle = p.eliminated ? '#666' : color;
        ctx.lineWidth = 1.5; ctx.stroke();
        ctx.textAlign='left'; ctx.textBaseline='top';
        if(p.eliminated){

        } else {
          const rank = aliveList.indexOf(p)+1;
          ctx.fillStyle = color; ctx.font='bold 9px system-ui';
          ctx.fillText((label?label+' ':'')+T('position'), x+5, Y+5);
          ctx.fillStyle = rank===1 ? '#f1c40f' : '#7ee8a2';
          ctx.font='bold 16px system-ui';
          ctx.fillText(rank+'/'+aliveList.length, x+5, Y+17);
        }
      };
      if(this.isMulti&&this.cars[1]){
        one(this.cars[0], 6, '#e74c3c', 'P1');
        one(this.cars[1], this.viewW-W-6, '#3498db', 'P2');
      } else if(this.player){

      }
    }
    if(this.state==='countdown'){

    }
    ctx.restore();

      else extraCls='no-action';
      if(previewColorCarId===car.id){cardAction='';extraCls=' no-action';}
      if(previewCarId===car.id){cardAction='';extraCls=' no-action';}
      const imgSrc=renderCarPreviewDataURL(car,shownColor);
      cards+='<div class="trackCard '+(active?'current':'')+extraCls+'" '+cardAction+'><div class="num">'+(owned?(active?'✓':'★'):'🛒')+'</div><div class="name">'+car.name+'</div>'+(imgSrc?'<img src="'+imgSrc+'" alt="'+car.name+'" style="display:block;width:100%;height:auto;margin:6px 0;border-radius:6px">':'')+renderCarStats(car)+(!owned?'<div class="price">'+car.price+'</div>':'')+colorRow+colorBuyRow+carBuyRow+'</div>';
    }
    this.show('<div class="title" style="font-size:36px">'+T('garage').toUpperCase()+'</div><div class="coinBar">'+s.coins+'</div><div class="trackGrid">'+cards+'</div><button class="btn small" data-action="menu">← '+T('menu')+'</button>');
  },
  showPause(){
    this.show('<div class="title" style="font-size:40px">'+T('pause')+'</div><button class="btn primary" data-action="resume">▶ '+T('resume')+'</button><button class="btn" data-action="restart">↻ '+T('restart')+'</button><button class="btn" data-action="menu">⌂ '+T('menu')+'</button>');
  },
  showResults(isRecord,reward,stars,battleRank,battleP2Rank){
    const p=Game.player;if(!p)return;
    stars=stars||0;
    const place=p.place;
    const time=(p.finished&&p.finishTime>0)?p.finishTime.toFixed(2):'—';
    const medals=['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣'];
    const medalFor=(pl)=>medals[clamp(pl-1,0,medals.length-1)]||'🏁';
    let titleHTML='',btns='';
    if(Game.mode==='time'){
      titleHTML='<div class="title" style="font-size:34px">'+Game.track.name+'</div><div class="bigStars">'+renderStars(stars)+'</div><div class="subtitle">'+(p.finished?T('time')+': '+time+'s':T('time'))+'</div>';
      const st=Game.track.starTimes;
      // Без знаков ≤: только ★ и секунды
      titleHTML+='<div class="stat"><span>★★★</span><b>'+st[0]+'s</b></div><div class="stat"><span>★★</span><b>'+st[1]+'s</b></div><div class="stat"><span>★</span><b>'+st[2]+'s</b></div>';
      btns+='<button class="btn primary" data-action="restart">↻ '+T('restart')+'</button>';
      btns+='<button class="btn" data-action="time">◀ '+T('sprints')+'</button>';
      btns+='<button class="btn small" data-action="menu">⌂ '+T('menu')+'</button>';
      this.show(titleHTML+'<div class="stat"><span>'+T('reward')+':</span><b>💰 '+reward+'</b></div><div class="coinBar">'+Save.data.coins+'</div>'+btns);
      return;
    }
    if(Game.mode==='battle'){
      const rank=battleRank||1;
      const totalCars=Game.cars.length;
      const p2Rank=battleP2Rank||null;
      const medal=rank===1?'👑':medalFor(rank);
      if(p2Rank!==null){
        titleHTML='<div class="title" style="font-size:32px">'+T('battle').toUpperCase()+'</div><div class="stat"><span>P1:</span><b>'+rank+'/'+totalCars+'</b></div><div class="stat"><span>P2:</span><b>'+p2Rank+'/'+totalCars+'</b></div>';
      } else {
        titleHTML='<div class="title" style="font-size:40px">'+T('battle').toUpperCase()+'</div><div style="font-size:80px;margin:14px 0">'+medal+'</div><div class="subtitle">'+rank+'/'+totalCars+'</div>';
      }
      btns+='<button class="btn primary" data-action="restart">↻ '+T('restart')+'</button>';
      btns+='<button class="btn" data-action="battle">◀ '+T('back')+'</button>';
      btns+='<button class="btn small" data-action="menu">⌂ '+T('menu')+'</button>';
      this.show(titleHTML+'<div class="stat"><span>'+T('reward')+':</span><b>💰 '+reward+'</b></div><div class="stat"><span>'+T('battleWins')+':</span><b>👑 '+(Save.data.battleWins||0)+'</b></div><div class="coinBar">'+Save.data.coins+'</div>'+btns);
      return;
    }
    const won=place===1&&p.finished;
    const isLast=Game.trackIdx>=TRACKS.length-1;
    if(Game.mode==='multi'&&Game.cars[1]){
      const p1=Game.cars[0],p2=Game.cars[1];
      titleHTML='<div class="title" style="font-size:28px">'+T('results')+'</div><div class="stat"><span>P1:</span><b>'+medalFor(p1.place)+' '+p1.place+'</b></div><div class="stat"><span>P2:</span><b>'+medalFor(p2.place)+' '+p2.place+'</b></div>';
    } else if(!p.finished){
      titleHTML='<div class="title" style="font-size:32px">'+T('results')+'</div><div style="font-size:70px;margin:10px 0">🏁</div><div class="subtitle">'+T('place')+' '+place+' '+T('of')+' '+Game.cars.length+'</div>';
    } else {
      const winner=Game._winner;
      if(winner&&!winner.isPlayer){
        titleHTML='<div class="title" style="font-size:32px">🏆 '+T('beaten')+' '+winner.name+'</div><div style="font-size:70px;margin:10px 0">'+medalFor(place)+'</div><div class="subtitle">'+T('place')+' '+place+' '+T('of')+' '+Game.cars.length+'</div>';
      } else {
        titleHTML='<div class="title" style="font-size:40px">'+T('finish')+'</div><div style="font-size:70px;margin:10px 0">'+medalFor(place)+'</div><div class="subtitle">'+(won?T('victory'):T('place')+' '+place+' '+T('of')+' '+Game.cars.length)+'</div>';
      }
    }
    if(won&&!isLast&&!Game.isMulti)btns+='<button class="btn primary" data-action="nextTrack">▶ '+T('next')+'</button>';
    btns+='<button class="btn" data-action="restart">↻ '+T('restart')+'</button>';
    btns+='<button class="btn small" data-action="menu">⌂ '+T('menu')+'</button>';
    this.show(titleHTML+'<div class="stat"><span>'+T('track')+':</span><b>'+Game.track.name+'</b></div><div class="stat"><span>'+T('time')+':</span><b>'+time+(time!=='—'?'s':'')+(isRecord?' 🏆':'')+'</b></div><div class="stat"><span>'+T('laps')+':</span><b>'+Game.track.laps+'</b></div>'+(!Game.isMulti?'<div class="stat"><span>'+T('reward')+':</span><b>💰 '+reward+'</b></div>':'')+'<div class="coinBar">'+Save.data.coins+'</div>'+btns);
  },
};
let _lastT=0,_booted=false;
function loop(now){
  if(!_booted)return;
  const dt=Math.min(0.05,(now-(_lastT||now))/1000);
  _lastT=now;
  try{
    const rs=['racing','countdown','finished'];
    if(rs.indexOf(Game.state)>=0)Game.update(dt);
    else if(Game.track){Game._time+=dt;Ambient.update(dt,Game.track.theme);}
    if(Game.state!=='menu'&&Game.state!=='campaign'&&Game.state!=='shop'&&Game.state!=='settings'){
      Game.draw();
    } else {
      const ctx=Game.ctx;
      if(ctx){
        ctx.setTransform(Game.dpr,0,0,Game.dpr,0,0);
        const w=Game.viewW,h=Game.viewH;
        const bg=ctx.createLinearGradient(0,0,0,h);
        bg.addColorStop(0,'#0e1424');bg.addColorStop(0.6,'#0a0a1a');bg.addColorStop(1,'#060614');
        ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
        const t=(performance.now()/1000)%40;
        ctx.strokeStyle='rgba(80,120,180,0.08)';ctx.lineWidth=1;
        for(let x=-40+t;x<w;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
        for(let y=0;y<h;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
        const now2=performance.now();
        ctx.strokeStyle='rgba(80,200,255,0.25)';ctx.lineWidth=2;
        for(let i=0;i<6;i++){
          const py=((now2/(20+i*8))%1)*(h+60)-30;
          const pl=30+i*18;
          const px=((now2/(15+i*10))%1)*(w+pl*2)-pl;
          ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+pl,py);ctx.stroke();
        }
        ctx.fillStyle='rgba(255,255,255,0.03)';
        ctx.font='bold 180px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('RACERS',w/2,h/2+60);
        Game._drawVignette(ctx);
      }
    }
  }catch(e){console.error('[Loop error]',e);}
  requestAnimationFrame(loop);
}
async function boot(){
  try{
    if(typeof YaGames!=='undefined'){
      try{
        YS.sdk = await YaGames.init();
        YS.hasSDK = true;
        try{const i18n = YS.sdk.environment && YS.sdk.environment.i18n;if(i18n && i18n.lang) YS.lang = i18n.lang;}catch(e){}
        try{ YS.player = await YS.sdk.getPlayer({scopes:false}); }catch(e){ console.warn('[SDK] getPlayer failed',e); }
        try{ YS.sdk.features.LoadingAPI.ready(); }catch(e){}
        try{ YS.sdk.on && YS.sdk.on('game_api_pause',()=>{ Audio.mute(); Music.stop(); }); }catch(e){}
        try{ YS.sdk.on && YS.sdk.on('game_api_resume',()=>{ Audio.unmute(); if(Game.state==='menu'||Game.state==='campaign'||Game.state==='shop'||Game.state==='settings')Music.play('menu'); }); }catch(e){}
      }catch(e){ console.warn('[SDK] Init failed',e); }
    } else {
      console.warn('[SDK] YaGames not available, running in offline mode');
    }
    if(!L10N[YS.lang]) YS.lang='ru';
    await Save.load();
    Game.init();
    UI.init();
    UI.showMenu();
    const wake=()=>{
      Audio.init();Audio.resume();
      if(Game.state==='menu'||Game.state==='campaign'||Game.state==='shop'||Game.state==='settings')Music.play('menu');
      document.removeEventListener('pointerdown',wake);
      document.removeEventListener('keydown',wake);
      document.removeEventListener('touchstart',wake);
    };
    document.addEventListener('pointerdown',wake);
    document.addEventListener('keydown',wake);
    document.addEventListener('touchstart',wake,{passive:true});
    _booted=true;
    requestAnimationFrame(loop);
    console.log('[Mini Racers] Ready. SDK:',YS.hasSDK,'Lang:',YS.lang);
  }catch(e){
    console.error('[Mini Racers] Boot failed',e);
    try{document.body.innerHTML='<pre style="padding:20px;color:#f88;font:14px monospace;white-space:pre-wrap">Boot error:\n'+(e&&e.message)+'\n\n'+(e&&e.stack)+'</pre>';}catch(_){}
  }
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();
</script>
