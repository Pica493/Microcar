<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mini Racers</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,sans-serif;user-select:none;color:#fff;touch-action:none}
  #game{display:block;width:100%;height:100%}
  #ui{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;z-index:100;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);overflow-y:auto}
  #ui.active{display:flex}
  .panel{max-width:720px;width:100%;text-align:center;padding:10px 0}
  .title{font-size:clamp(32px,8vw,56px);font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#ff7676,#ffce54,#7ee8a2,#66c2ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}
  .subtitle{opacity:.65;margin-bottom:20px;font-size:15px}
  .coinBar{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:20px;background:rgba(241,196,15,.12);border:1px solid rgba(241,196,15,.35);margin-bottom:16px;font-weight:800;color:#f1c40f;font-size:16px}
  .coinBar::before{content:'💰';font-size:18px}
  .btn{display:block;width:100%;padding:15px 24px;margin:8px 0;background:#2a3142;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .08s,background .15s}
  .btn:active{transform:scale(.97);background:#3a4258}
  .btn.primary{background:linear-gradient(180deg,#4f8ef7,#2a6cd6);border-color:#4f8ef7}
  .btn.gold{background:linear-gradient(180deg,#f5c542,#d99e07);border-color:#f5c542;color:#1a1a1a}
  .btn.green{background:linear-gradient(180deg,#2ecc71,#229954);border-color:#2ecc71}
  .btn.small{padding:10px 16px;font-size:14px}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .stat{display:flex;justify-content:space-between;padding:12px 16px;margin:6px 0;background:rgba(255,255,255,.05);border-radius:10px;font-size:15px}
  .stat b{color:#f1c40f}
  .controls{margin-top:20px;opacity:.55;font-size:12px;line-height:1.8;text-align:left;padding:12px 16px;background:rgba(255,255,255,.04);border-radius:10px}
  .controls b{color:#7ee8a2}
  .trackGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:16px 0}
  .trackCard{position:relative;padding:14px 12px;border-radius:12px;background:#1e2434;border:2px solid rgba(255,255,255,.08);cursor:pointer;text-align:left;transition:transform .1s,border-color .15s}
  .trackCard:active{transform:scale(.96)}
  .trackCard.locked{opacity:.45;cursor:not-allowed}
  .trackCard.current{border-color:#4f8ef7;box-shadow:0 0 0 1px #4f8ef7 inset}
  .trackCard .num{font-size:11px;opacity:.5;font-weight:800;letter-spacing:1px}
  .trackCard .name{font-weight:800;font-size:16px;margin:4px 0 4px}
  .trackCard .best{font-size:12px;color:#f1c40f;font-weight:700}
  .trackCard .desc{font-size:11px;color:rgba(255,255,255,.55);margin-top:4px;line-height:1.3}
  .trackCard .lock{position:absolute;top:8px;right:10px;font-size:18px;opacity:.7}
  .trackCard .price{font-size:13px;font-weight:800;color:#f1c40f;margin-top:6px}
  .trackCard .price::before{content:'💰 '}
  .statsRow{display:flex;gap:3px;margin-top:6px}
  .statDot{width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.15)}
  .statDot.on{background:linear-gradient(90deg,#7ee8a2,#4f8ef7)}
  .codeDisplay{font-family:'Courier New',monospace;font-size:42px;font-weight:900;letter-spacing:10px;color:#7ee8a2;background:rgba(126,232,162,.1);border:2px dashed rgba(126,232,162,.4);padding:20px;border-radius:14px;margin:20px 0;text-align:center;cursor:pointer;transition:background .15s}
  .codeDisplay:active{background:rgba(126,232,162,.2)}
  .codeInput{width:100%;padding:18px;font-family:'Courier New',monospace;font-size:32px;font-weight:900;letter-spacing:10px;text-align:center;text-transform:uppercase;background:#1e2434;color:#fff;border:2px solid rgba(255,255,255,.15);border-radius:14px;margin:16px 0;outline:none}
  .codeInput:focus{border-color:#4f8ef7}
  .status{padding:10px;border-radius:10px;margin:10px 0;font-size:14px}
  .status.waiting{background:rgba(241,196,15,.15);color:#f1c40f}
  .status.ok{background:rgba(126,232,162,.15);color:#7ee8a2}
  .status.err{background:rgba(255,118,118,.15);color:#ff7676}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:#4f8ef7;border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  #touchLayer{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}
  #touchLayer.active{display:block}
  #stick{position:absolute;left:30px;bottom:30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);pointer-events:auto}
  #stickKnob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(255,255,255,.4);border:2px solid rgba(255,255,255,.7);transition:transform .04s}
  #gasBtn{position:absolute;right:30px;bottom:30px;width:110px;height:110px;border-radius:50%;background:rgba(80,220,120,.4);border:2px solid rgba(255,255,255,.6);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
  #gasBtn.pressed{background:rgba(80,220,120,.75)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<div id="touchLayer">
  <div id="stick"><div id="stickKnob"></div></div>
  <div id="gasBtn">GAS</div>
</div>
<script>
'use strict';

// ============================================================
// УТИЛИТЫ
// ============================================================
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const rand = (a,b) => a+Math.random()*(b-a);
const dist = (x1,y1,x2,y2) => Math.hypot(x2-x1,y2-y1);

function roundRect(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function seededRand(seed){let s=seed|0;return()=>{s=(s*1664525+1013904223)|0;return((s>>>0)%100000)/100000;};}
function hexToRgb(hex){if(typeof hex!=='string')return{r:200,g:60,b:60};const m=/^#?([a-f\d]{3}|[a-f\d]{6})$/i.exec(hex);if(!m)return{r:200,g:60,b:60};let h=m[1];if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return{r:parseInt(h.substr(0,2),16),g:parseInt(h.substr(2,2),16),b:parseInt(h.substr(4,2),16)};}
const lighten=(h,a)=>{const c=hexToRgb(h);return`rgb(${Math.min(255,c.r+a)},${Math.min(255,c.g+a)},${Math.min(255,c.b+a)})`;};
const darken=(h,a)=>{const c=hexToRgb(h);return`rgb(${Math.max(0,c.r-a)},${Math.max(0,c.g-a)},${Math.max(0,c.b-a)})`;};

// ============================================================
// АУДИО
// ============================================================
const Audio = {
  ctx:null,on:true,muted:false,
  init(){if(this.ctx)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){this.ctx=null;}},
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});},
  mute(){this.muted=true;},unmute(){this.muted=false;},
  beep(f,d,t='sine',v=0.15){if(!this.ctx||!this.on||this.muted)return;try{const n=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(0.0001,n+d);o.connect(g);g.connect(this.ctx.destination);o.start(n);o.stop(n+d+0.05);}catch(e){}},
  countdown(n){this.beep(n>0?440:880,0.2,'square',0.2);},
  finish(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.beep(f,0.2,'triangle',0.2),i*100));},
  lap(){this.beep(660,0.1);setTimeout(()=>this.beep(880,0.15),80);},
  hit(){this.beep(120,0.08,'square',0.15);},
  boost(){this.beep(880,0.1);setTimeout(()=>this.beep(1320,0.12),60);},
  buy(){[660,880,1320].forEach((f,i)=>setTimeout(()=>this.beep(f,0.15,'triangle',0.2),i*80));},
  connect(){[440,660,880].forEach((f,i)=>setTimeout(()=>this.beep(f,0.15,'sine',0.2),i*120));},
};

// ============================================================
// YANDEX SDK
// ============================================================
const Yandex = {
  ysdk:null,ready:false,adShowing:false,_lastFs:0,_cooldown:60000,
  async init(){
    if(typeof YaGames==='undefined')return;
    try{
      this.ysdk=await YaGames.init();this.ready=true;
      if(this.ysdk.features?.LoadingAPI)this.ysdk.features.LoadingAPI.ready();
      this.ysdk.on('game_api_pause',()=>{Audio.mute();Game.setPlatformPaused(true);this._gpStop();});
      this.ysdk.on('game_api_resume',()=>{Audio.unmute();Game.setPlatformPaused(false);this._gpStart();});
    }catch(e){}
  },
  _gpStart(){if(this.ysdk?.features?.GameplayAPI)try{this.ysdk.features.GameplayAPI.start();}catch(e){}},
  _gpStop(){if(this.ysdk?.features?.GameplayAPI)try{this.ysdk.features.GameplayAPI.stop();}catch(e){}},
  showFullscreenAd(cb){if(!this.ready||!this.ysdk?.adv){cb&&cb(false);return;}const now=Date.now();if(now-this._lastFs<this._cooldown){cb&&cb(false);return;}this._lastFs=now;this.adShowing=true;Audio.mute();Game.setAdPaused(true);this._gpStop();this.ysdk.adv.showFullscreenAdv({callbacks:{onClose:()=>{this.adShowing=false;Audio.unmute();Game.setAdPaused(false);this._gpStart();cb&&cb(true);},onError:()=>{this.adShowing=false;Audio.unmute();Game.setAdPaused(false);this._gpStart();cb&&cb(false);}}});},
  showRewardedAd(cb){if(!this.ready||!this.ysdk?.adv){cb&&cb(false);return;}this.adShowing=true;Audio.mute();Game.setAdPaused(true);this._gpStop();let r=false;this.ysdk.adv.showRewardedVideo({callbacks:{onRewarded:()=>{r=true;},onClose:()=>{this.adShowing=false;Audio.unmute();Game.setAdPaused(false);this._gpStart();cb&&cb(r);},onError:()=>{this.adShowing=false;Audio.unmute();Game.setAdPaused(false);this._gpStart();cb&&cb(false);}}});},
};

// ============================================================
// СОХРАНЕНИЕ
// ============================================================
const Save = {
  KEY:'mini_racers_v3',
  data:{unlocked:1,best:{},coins:0,ownedCars:['rocket'],currentCar:'rocket'},
  load(){try{const raw=localStorage.getItem(this.KEY);if(raw){const p=JSON.parse(raw);this.data.unlocked=clamp(p.unlocked||1,1,10);this.data.best=p.best||{};this.data.coins=Math.max(0,p.coins||0);this.data.ownedCars=Array.isArray(p.ownedCars)&&p.ownedCars.length?p.ownedCars:['rocket'];this.data.currentCar=p.currentCar&&this.data.ownedCars.includes(p.currentCar)?p.currentCar:'rocket';}}catch(e){}},
  save(){try{localStorage.setItem(this.KEY,JSON.stringify(this.data));}catch(e){}},
  unlock(idx){if(idx+1>this.data.unlocked){this.data.unlocked=Math.min(10,idx+1);this.save();}},
  setBest(idx,time){const k=String(idx);if(!this.data.best[k]||time<this.data.best[k]){this.data.best[k]=time;this.save();return true;}return false;},
};

// ============================================================
// ONLINE (WebRTC через PeerJS)
// ============================================================
const Online = {
  peer: null,
  conn: null,
  isHost: false,
  roomCode: null,
  connected: false,
  connecting: false,
  remoteInput: { throttle:0, brake:0, steer:0, handbrake:false },

  generateCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random()*chars.length)];
    return code;
  },

  host(trackIdx, onReady, onError) {
    this.cleanup();
    this.isHost = true;
    this.connecting = true;
    const code = this.generateCode();
    const peerId = 'mini-racer-' + code;
    this.roomCode = code;

    try {
      this.peer = new Peer(peerId, { debug: 0 });
    } catch(e) {
      this.connecting = false;
      onError && onError('Не удалось инициализировать сеть');
      return;
    }

    let opened = false;
    const timeout = setTimeout(() => {
      if (!opened) {
        this.cleanup();
        onError && onError('Сервер сигнализации не отвечает. Попробуйте позже.');
      }
    }, 12000);

    this.peer.on('open', () => {
      opened = true;
      clearTimeout(timeout);
      this.connecting = false;
      onReady && onReady(code);
    });

    this.peer.on('connection', conn => {
      if (this.conn) { try { conn.close(); } catch(e){} return; }
      this.conn = conn;
      conn.on('open', () => {
        this.connected = true;
        Audio.connect();
        Game.startTrack(trackIdx, 'online-host');
        Online.send({ t: 'start', trackIdx });
      });
      conn.on('data', d => this.onData(d));
      conn.on('close', () => this.onDisconnect());
      conn.on('error', () => this.onDisconnect());
    });

    this.peer.on('error', err => {
      clearTimeout(timeout);
      this.connecting = false;
      if (err.type === 'unavailable-id') {
        this.host(trackIdx, onReady, onError);
        return;
      }
      onError && onError('Ошибка: ' + err.type);
      this.cleanup();
    });
  },

  join(code, onReady, onError) {
    this.cleanup();
    this.isHost = false;
    this.connecting = true;
    code = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 6) {
      this.connecting = false;
      onError && onError('Код должен состоять из 6 символов');
      return;
    }
    this.roomCode = code;

    try {
      this.peer = new Peer({ debug: 0 });
    } catch(e) {
      this.connecting = false;
      onError && onError('Не удалось инициализировать сеть');
      return;
    }

    let opened = false;
    const timeout = setTimeout(() => {
      if (!opened || !this.connected) {
        this.cleanup();
        onError && onError('Не удалось подключиться. Проверьте код или попробуйте позже.');
      }
    }, 15000);

    this.peer.on('open', () => {
      opened = true;
      const targetId = 'mini-racer-' + code;
      const conn = this.peer.connect(targetId, { reliable: true });
      this.conn = conn;

      conn.on('open', () => {
        clearTimeout(timeout);
        this.connected = true;
        this.connecting = false;
        Audio.connect();
        onReady && onReady();
      });
      conn.on('data', d => this.onData(d));
      conn.on('close', () => this.onDisconnect());
      conn.on('error', () => {
        clearTimeout(timeout);
        this.connecting = false;
        onError && onError('Ошибка соединения с хостом');
        this.cleanup();
      });
    });

    this.peer.on('error', err => {
      clearTimeout(timeout);
      this.connecting = false;
      if (err.type === 'peer-unavailable') {
        onError && onError('Комната не найдена. Проверьте код.');
      } else {
        onError && onError('Ошибка: ' + err.type);
      }
      this.cleanup();
    });
  },

  send(msg) {
    if (this.conn && this.conn.open) {
      try { this.conn.send(msg); } catch(e){}
    }
  },

  onData(data) {
    if (!data || !data.t) return;
    if (data.t === 'start') {
      Game.startTrack(data.trackIdx, 'online-guest');
    } else if (data.t === 'input') {
      this.remoteInput.throttle = data.throttle || 0;
      this.remoteInput.brake = data.brake || 0;
      this.remoteInput.steer = data.steer || 0;
      this.remoteInput.handbrake = !!data.handbrake;
    } else if (data.t === 'snap') {
      Game.applySnapshot(data.cars, data.rt);
    } else if (data.t === 'restart') {
      Game.startTrack(data.trackIdx, 'online-guest');
    } else if (data.t === 'quit') {
      this.onDisconnect();
    }
  },

  onDisconnect() {
    if (!this.connected && !this.connecting) return;
    const wasInRace = Game.state !== 'menu';
    this.cleanup();
    if (wasInRace) {
      UI.showDisconnectNotice();
    }
  },

  cleanup() {
    if (this.conn) { try { this.conn.close(); } catch(e){} this.conn = null; }
    if (this.peer) { try { this.peer.destroy(); } catch(e){} this.peer = null; }
    this.connected = false;
    this.connecting = false;
    this.isHost = false;
    this.roomCode = null;
    this.remoteInput = { throttle: 0, brake: 0, steer: 0, handbrake: false };
  },
};

// ============================================================
// ЧАСТИ КУЗОВОВ
// ============================================================
function drawWheel(ctx,x,y,w,h,ang,rim){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.fillStyle='rgba(0,0,0,0.4)';roundRect(ctx,-w/2+1,-h/2+1.5,w,h,1.6);ctx.fill();ctx.fillStyle='#0a0a0a';roundRect(ctx,-w/2,-h/2,w,h,1.6);ctx.fill();if(rim){ctx.fillStyle=rim;roundRect(ctx,-w/2+1,-h/2+0.9,w-2,h-1.8,1);ctx.fill();ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(-0.7,-h/2+0.9,1.4,h-1.8);}ctx.restore();}
function drawNumberBadge(ctx,x,y,num){ctx.fillStyle='rgba(0,0,0,0.75)';ctx.beginPath();ctx.arc(x,y,3.6,0,TAU);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=0.7;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 5px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(num),x,y+0.4);ctx.textAlign='left';ctx.textBaseline='alphabetic';}
function drawWindowGlass(ctx,x,y,w,h,r){const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'rgba(80,120,180,0.9)');g.addColorStop(0.5,'rgba(20,30,55,0.92)');g.addColorStop(1,'rgba(10,18,35,0.95)');ctx.fillStyle=g;roundRect(ctx,x,y,w,h,r);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.35)';ctx.beginPath();ctx.moveTo(x+1,y+1);ctx.lineTo(x+w*0.4,y+1);ctx.lineTo(x+w*0.1,y+h-1);ctx.lineTo(x+1,y+h-1);ctx.closePath();ctx.fill();}
function drawHeadlights(ctx,x,y,w,h,color='#ffedaa'){ctx.fillStyle='#c8c8c8';roundRect(ctx,x-0.5,y-0.5,w+1,h+1,h/2);ctx.fill();ctx.fillStyle=color;roundRect(ctx,x,y,w,h,h/2);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.95)';ctx.fillRect(x+w*0.2,y+h*0.25,w*0.3,h*0.3);}
function drawTaillights(ctx,x,y,w,h){ctx.fillStyle='#3a0a0a';roundRect(ctx,x-0.5,y-0.5,w+1,h+1,h/2);ctx.fill();ctx.fillStyle='#ff2b2b';roundRect(ctx,x,y,w,h,h/2);ctx.fill();ctx.fillStyle='rgba(255,150,150,0.7)';ctx.fillRect(x+w*0.2,y+h*0.25,w*0.5,h*0.3);}

// ============================================================

  tire:{r:24,solid:true,bounce:1.4,drag:0},
  barrel:{r:22,solid:true,bounce:1.6,drag:0},
  oil:{r:55,solid:false,bounce:0,drag:6},
  boost:{r:32,solid:false,bounce:0,drag:0},
};

class Track {
  constructor(def) {
    this.name = def.name;
    this.roadWidth = def.roadWidth;
    this.laps = def.laps || 3;
    this.aiSkill = def.aiSkill || 0.85;
    this.points = def.points;
    this.theme = THEMES[def.theme] || THEMES.meadow;
    this.themeId = def.theme;
    this.segments = [];
    this.cumulative = [0];
    let total = 0;
    for (let i=0;i<this.points.length;i++){
      const a = this.points[i], b = this.points[(i+1)%this.points.length];
      const dx = b.x-a.x, dy = b.y-a.y;
      const len = Math.hypot(dx,dy);
      this.segments.push({a,b,dx,dy,len,len2:len*len});
      total += len;
      this.cumulative.push(total);
    }
    this.totalLength = total;
    this.obstacles = (def.obstacles||[]).map(o=>{const t=OBSTACLE_TYPES[o.type]||OBSTACLE_TYPES.cone;return{...o,...t,_used:false,_respawn:0};});
    this.decor = [];
    const kinds = this.theme.decor;
    const rng = seededRand(def.points.length*31+7);
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for (const p of def.points){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);}
    const pad = 350;
    minX-=pad;maxX+=pad;minY-=pad;maxY+=pad;
    for (let i=0;i<160;i++){
      const x = minX+rng()*(maxX-minX), y = minY+rng()*(maxY-minY);
      const p = this.project(x,y);
      if (p.dist < this.roadWidth*0.75) continue;
      const kind = kinds[Math.floor(rng()*kinds.length)];
      const s = 0.85+rng()*0.55;
      const seed = rng();
      const seed2 = Math.floor(rng()*10);
      this.decor.push({x,y,kind,seed,scale:s,seed2});
    }
  }
  project(x,y){
    let bestDist=Infinity,bestProgress=0,bestPx=0,bestPy=0;
    for (let i=0;i<this.segments.length;i++){
      const s = this.segments[i];
      let t = ((x-s.a.x)*s.dx + (y-s.a.y)*s.dy) / s.len2;
      t = clamp(t,0,1);
      const px = s.a.x + s.dx*t, py = s.a.y + s.dy*t;
      const d = Math.hypot(x-px,y-py);
      if (d<bestDist){bestDist=d;bestProgress=(this.cumulative[i]+t*s.len)/this.totalLength;bestPx=px;bestPy=py;}
    }
    return {dist:bestDist,progress:bestProgress,px:bestPx,py:bestPy};
  }
  pointAtProgress(p){
    p = ((p%1)+1)%1;
    const target = p*this.totalLength;
    for (let i=0;i<this.segments.length;i++){
      if (target >= this.cumulative[i] && target <= this.cumulative[i+1]) {
        const s = this.segments[i];
        const t = (target - this.cumulative[i]) / s.len;
        return {x:s.a.x + s.dx*t, y:s.a.y + s.dy*t};
      }
    }
    return {x:this.points[0].x, y:this.points[0].y};
  }
  getStart(){const a=this.points[0],b=this.points[1];return{x:a.x,y:a.y,angle:Math.atan2(b.y-a.y,b.x-a.x)};}
  getPath2D(){
    if (this._path) return this._path;
    const p = new Path2D();
    p.moveTo(this.points[0].x, this.points[0].y);
    for (let i=1;i<this.points.length;i++) p.lineTo(this.points[i].x, this.points[i].y);
    p.closePath();
    this._path = p;
    return p;
  }
}

const CAR_R = 15;
const BASE_ENGINE = 700, BASE_MAX_SPEED = 380, BASE_GRIP = 9, BASE_TURN = 3.2;

class Car {
  constructor(x,y,angle,isPlayer,isPlayer2,name,num,carDef){
    this.x=x;this.y=y;this.angle=angle;this.vx=0;this.vy=0;
    this.isPlayer=isPlayer;this.isPlayer2=isPlayer2||false;
    this.name=name;this.num=num;this.carDef=carDef;
    this.color=carDef.color;this.accent=carDef.accent;this.bodyDraw=carDef.body;this.stats=carDef.stats;
    this.lap=0;this.progress=0;this.prevProgress=0;this.place=1;
    this.finished=false;this.finishTime=0;
    this.wheelAngle=0;this.aiStuckTime=0;this.aiReverseTime=0;this.boostTime=0;
    if (isPlayer || isPlayer2){
      this.engineForce=BASE_ENGINE*this.stats.engine;
      this.maxSpeedVal=BASE_MAX_SPEED*this.stats.maxSpeed;
      this.gripVal=BASE_GRIP*this.stats.grip;
      this.turnRate=BASE_TURN*this.stats.turn;
      this.weight=this.stats.weight;
    } else {
      this.engineForce=BASE_ENGINE*0.95;this.maxSpeedVal=BASE_MAX_SPEED*0.95;
      this.gripVal=BASE_GRIP;this.turnRate=BASE_TURN;this.weight=1;
    }
  }
  get speed(){return Math.hypot(this.vx,this.vy);}
  update(dt,throttle,brake,steer,handbrake,track){
    const cos=Math.cos(this.angle),sin=Math.sin(this.angle);
    let vf=this.vx*cos+this.vy*sin;
    let vs=-this.vx*sin+this.vy*cos;
    const DRAG=1.4,BRAKE_FORCE=900,DRIFT_GRIP=3;
    if (throttle>0) vf += this.engineForce*throttle*dt;
    if (brake>0) vf -= BRAKE_FORCE*brake*dt;
    if (this.boostTime>0){vf += 400*dt;this.boostTime-=dt;}
    const grip = handbrake?DRIFT_GRIP:this.gripVal;
    vf *= Math.exp(-DRAG*dt);vs *= Math.exp(-grip*dt);
    const maxSpeed = handbrake?this.maxSpeedVal*0.75:this.maxSpeedVal*(this.boostTime>0?1.3:1);
    vf = clamp(vf,-maxSpeed*0.4,maxSpeed);
    const steerFactor = clamp(Math.abs(vf)/100,0,1);
    const dir = vf>=0?1:-1;
    const turnMul = handbrake?1.4:1;
    this.angle += steer*this.turnRate*steerFactor*dir*turnMul*dt;
    const nc=Math.cos(this.angle),ns=Math.sin(this.angle);
    this.vx = nc*vf - ns*vs;
    this.vy = ns*vf + nc*vs;
    this.x += this.vx*dt;this.y += this.vy*dt;
    const proj = track.project(this.x,this.y);
    const halfRoad = track.roadWidth/2;
    if (proj.dist > halfRoad){const k=Math.exp(-4*dt);this.vx*=k;this.vy*=k;}
    this.prevProgress = this.progress;
    this.progress = proj.progress;
    if (this.prevProgress>0.75 && this.progress<0.25){this.lap++;if(this.isPlayer && !this.finished)Audio.lap();}
    else if (this.prevProgress<0.25 && this.progress>0.75){if(this.lap>0)this.lap--;}
    this.wheelAngle = lerp(this.wheelAngle,steer*0.5,1-Math.exp(-12*dt));
  }
  getRaceProgress(){return this.lap+this.progress;}
  draw(ctx){
    ctx.save();ctx.translate(this.x+3,this.y+4);ctx.rotate(this.angle);
    ctx.fillStyle='rgba(0,0,0,0.35)';roundRect(ctx,-19,-11,38,22,6);ctx.fill();ctx.restore();
    ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.angle);
    if (this.boostTime>0){
      const fl = 14+Math.sin(performance.now()/40)*4;
      const g = ctx.createLinearGradient(-18,0,-18-fl,0);
      g.addColorStop(0,'rgba(255,240,120,0.95)');g.addColorStop(0.5,'rgba(255,140,60,0.75)');g.addColorStop(1,'rgba(255,60,20,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-18,-6);ctx.lineTo(-18-fl,0);ctx.lineTo(-18,6);ctx.closePath();ctx.fill();
    }
    this.bodyDraw(ctx,this.color,this.wheelAngle,this.num,this.accent);
    if (this.isPlayer2){
      ctx.fillStyle='#00e5ff';ctx.font='bold 8px system-ui';
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('P2',0,-14);
    }
    ctx.restore();
  }
}

const Input = {
  keys:{},
  stickActive:false,stickId:null,stickDx:0,stickDy:0,
  gasPressed:false,isTouch:false,
  multiMode:false,
  init(){
    window.addEventListener('keydown',e=>{
      this.keys[e.code]=true;
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
      if (e.code==='Escape' && (Game.state==='racing' || Game.state==='countdown')) Game.pause();
      if (e.code==='KeyR' && (Game.state==='racing' || Game.state==='countdown')) Game.restart();
    });
    window.addEventListener('keyup',e=>{this.keys[e.code]=false;});
    window.addEventListener('blur',()=>{this.keys={};});
    this.isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
    const stick=document.getElementById('stick'),knob=document.getElementById('stickKnob'),gasBtn=document.getElementById('gasBtn');
    stick.addEventListener('touchstart',e=>{e.preventDefault();this.stickId=e.changedTouches[0].identifier;this.stickActive=true;this.stickDx=0;this.stickDy=0;},{passive:false});
    window.addEventListener('touchmove',e=>{
      if (this.stickId===null) return;
      for (const t of e.changedTouches){
        if (t.identifier!==this.stickId) continue;
        const r=stick.getBoundingClientRect();
        let dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);
        const m=Math.hypot(dx,dy),max=r.width*0.4;
        if (m>max){dx=dx/m*max;dy=dy/m*max;}
        this.stickDx=dx/max;this.stickDy=dy/max;
        knob.style.transform=`translate(${dx}px,${dy}px)`;
      }
    },{passive:false});
    const stickEnd = e=>{
      for (const t of e.changedTouches) if (t.identifier===this.stickId){
        this.stickId=null;this.stickActive=false;this.stickDx=0;this.stickDy=0;
        knob.style.transform='';
      }
    };
    window.addEventListener('touchend',stickEnd);
    window.addEventListener('touchcancel',stickEnd);
    const gs=e=>{e.preventDefault();this.gasPressed=true;gasBtn.classList.add('pressed');};
    const ge=()=>{this.gasPressed=false;gasBtn.classList.remove('pressed');};
    gasBtn.addEventListener('touchstart',gs,{passive:false});
    gasBtn.addEventListener('touchend',ge);
    gasBtn.addEventListener('touchcancel',ge);
  },
  showTouch(on){document.getElementById('touchLayer').classList.toggle('active',on&&this.isTouch);},
  get throttle(){
    if (this.keys.KeyW) return 1;
    if (!this.multiMode && this.keys.ArrowUp) return 1;
    if (this.gasPressed) return 1;
    if (this.stickActive && this.stickDy<-0.2) return 1;
    return 0;
  },
  get brake(){
    if (this.keys.KeyS) return 1;
    if (!this.multiMode && this.keys.ArrowDown) return 1;
    if (this.stickActive && this.stickDy>0.5) return 1;
    return 0;
  },
  get steer(){
    let s=0;
    if (this.keys.KeyA) s-=1;
    if (this.keys.KeyD) s+=1;
    if (!this.multiMode){
      if (this.keys.ArrowLeft) s-=1;
      if (this.keys.ArrowRight) s+=1;
    }
    if (this.stickActive && Math.abs(this.stickDx)>0.15) s=this.stickDx;
    return clamp(s,-1,1);
  },
  get handbrake(){return !!this.keys.Space;},
  get throttle2(){if (this.keys.ArrowUp) return 1;return 0;},
  get brake2(){if (this.keys.ArrowDown) return 1;return 0;},
  get steer2(){let s=0;if (this.keys.ArrowLeft) s-=1;if (this.keys.ArrowRight) s+=1;return clamp(s,-1,1);},
  get handbrake2(){return !!(this.keys.Enter || this.keys.ShiftRight || this.keys.Numpad0);},
};

// AI (улучшенная версия)
// ============================================================
const AI = {
  think(car, dt, track, game) {
    const proj = track.project(car.x, car.y);
    const lookahead = 100 + car.speed * 0.45;
    const lookProgress = proj.progress + lookahead / track.totalLength;
    const lookPoint = track.pointAtProgress(lookProgress);
    let targetX = lookPoint.x, targetY = lookPoint.y;

    const distFromCenter = proj.dist;
    const halfRoad = track.roadWidth / 2;

    // Возврат на центральную линию, если сбились
    if (distFromCenter > halfRoad * 0.55) {
      const pull = clamp((distFromCenter - halfRoad * 0.55) / (halfRoad * 0.9), 0, 1);
      targetX = lerp(lookPoint.x, proj.px, pull * 0.85);
      targetY = lerp(lookPoint.y, proj.py, pull * 0.85);
    }

    const fx = Math.cos(car.angle), fy = Math.sin(car.angle);
    let avoidX = 0, avoidY = 0;

    // Объезд препятствий (снижено с 280 → 130)
    for (const o of track.obstacles) {
      if (!o.solid || o._used) continue;
      const dx = o.x - car.x, dy = o.y - car.y;
      const ahead = dx * fx + dy * fy;
      const side = -dx * fy + dy * fx;
      if (ahead < -10 || ahead > 180) continue;
      const dangerDist = o.r + CAR_R + 30;
      if (Math.abs(side) < dangerDist) {
        const proximity = (dangerDist - Math.abs(side)) / dangerDist;
        const nearness = 1 - clamp(ahead / 180, 0, 1);
        const push = proximity * nearness * 130;
        const sign = side >= 0 ? -1 : 1;
        avoidX += -fy * sign * push;
        avoidY += fx * sign * push;
      }
    }

    // Объезд других машин (снижено с 150 → 90)
    for (const other of game.cars) {
      if (other === car) continue;
      const dx = other.x - car.x, dy = other.y - car.y;
      const ahead = dx * fx + dy * fy;
      const side = -dx * fy + dy * fx;
      if (ahead < -10 || ahead > 120) continue;
      const dangerDist = 50;
      if (Math.abs(side) < dangerDist) {
        const proximity = (dangerDist - Math.abs(side)) / dangerDist;
        const nearness = 1 - clamp(ahead / 120, 0, 1);
        const push = proximity * nearness * 90;
        const sign = side >= 0 ? -1 : 1;
        avoidX += -fy * sign * push;
        avoidY += fx * sign * push;
      }
    }

    targetX += avoidX;
    targetY += avoidY;

    const desired = Math.atan2(targetY - car.y, targetX - car.x);
    let diff = desired - car.angle;
    while (diff > Math.PI) diff -= TAU;
    while (diff < -Math.PI) diff += TAU;

    const steer = clamp(diff * 2.8, -1, 1);
    const absDiff = Math.abs(diff);

    let throttle = track.aiSkill, brake = 0;
    if (absDiff > 1.3) throttle *= 0.12;
    else if (absDiff > 0.9) throttle *= 0.4;
    else if (absDiff > 0.5) throttle *= 0.75;
    if (distFromCenter > halfRoad * 0.55) throttle *= 0.8;
    if (absDiff > 1.3 && car.speed > 230) { brake = 0.5; throttle = 0; }

    // Анти-застревание: реверс только при полной остановке в крутом повороте
    if (car.aiReverseTime > 0) {
      car.aiReverseTime -= dt;
      return { throttle: 0, brake: 1, steer: -steer };
    }
    if (car.speed < 15 && absDiff > 1.2) {
      car.aiStuckTime += dt;
      if (car.aiStuckTime > 0.6) {
        car.aiStuckTime = 0;
        car.aiReverseTime = 0.55;
        return { throttle: 0, brake: 1, steer: -steer };
      }
    } else {
      car.aiStuckTime = Math.max(0, car.aiStuckTime - dt * 2);
    }
    return { throttle, brake, steer };
  }
};

const Particles = {
  list:[],
  add(x,y,vx,vy,life,color,size){if(this.list.length>250)return;this.list.push({x,y,vx,vy,life,maxLife:life,color,size});},
  burst(x,y,color,n,speed){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=rand(speed*0.5,speed);this.add(x,y,Math.cos(a)*s,Math.sin(a)*s,rand(0.3,0.6),color,rand(2,4));}},
  update(dt){for(let i=this.list.length-1;i>=0;i--){const p=this.list[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.94;p.vy*=0.94;p.life-=dt;if(p.life<=0)this.list.splice(i,1);}},
  draw(ctx){for(const p of this.list){ctx.globalAlpha=clamp(p.life/p.maxLife,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.fill();}ctx.globalAlpha=1;},
  clear(){this.list.length=0;},
};

const Ambient = {
  list:[],
  reset(theme){
    this.list.length=0;
    if (!theme||!theme.ambient) return;
    const cfg = theme.ambient;
    for (let i=0;i<cfg.count;i++) this.spawn(cfg);
  },
  spawn(cfg){
    this.list.push({
      x:Math.random()*Math.max(1,window.innerWidth),
      y:Math.random()*Math.max(1,window.innerHeight),
      vx:rand(-cfg.speed*0.5,cfg.speed*0.5),
      vy:rand(cfg.speed*0.5,cfg.speed),
      size:cfg.size*(0.7+Math.random()*0.6),
      rot:Math.random()*TAU,rotSpd:rand(-2,2),
      life:0,maxLife:rand(3,6),cfg,
    });
  },
  update(dt,theme){
    if (!theme||!theme.ambient){this.list.length=0;return;}
    const cfg = theme.ambient;
    while (this.list.length < cfg.count) this.spawn(cfg);
    const W=window.innerWidth,H=window.innerHeight;
    for (let i=this.list.length-1;i>=0;i--){
      const p = this.list[i];
      p.life += dt;
      p.x += p.vx*dt + Math.sin(p.life*2+i)*20*dt;
      p.y += p.vy*dt;
      p.rot += p.rotSpd*dt;
      if (p.y>H+20 || p.life>p.maxLife){this.list.splice(i,1);this.spawn(cfg);}
    }
  },
  draw(ctx){
    if (!this.list.length) return;
    for (const p of this.list){
      const alpha = clamp(Math.min(p.life*2, p.maxLife-p.life)/1,0,1);
      ctx.globalAlpha = alpha*0.7;
      ctx.fillStyle = p.cfg.color;
      if (p.cfg.type === 'leaves'){
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
        ctx.beginPath();ctx.ellipse(0,0,p.size,p.size*0.5,0,0,TAU);ctx.fill();
        ctx.restore();
      } else {
        ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
};

const Game = {
  canvas:null,ctx:null,dpr:1,viewW:0,viewH:0,
  state:'menu',track:null,trackIdx:0,
  cars:[],player:null,player2:null,
  mode:'single', isMulti:false, isOnline:false, isHost:false, isGuest:false,
  camera:{x:0,y:0,zoom:1},
  countdown:0,raceTime:0,finishDelay:0,
  _lastCountShown:-1,_shake:0,
  _pausedState:null,_platformPaused:false,_adPaused:false,
  _time:0,_lastReward:0,
  _inputTimer:0,_snapshotTimer:0,

  init(){
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d',{alpha:false});
    this.dpr = Math.min(2,window.devicePixelRatio||1);
    this.resize();
    window.addEventListener('resize',()=>this.resize());
    Input.init();
    document.addEventListener('visibilitychange',()=>{
      if (document.hidden){
        Audio.mute();
        if (this.state==='racing' || this.state==='countdown') this.pause();
      } else if (!Yandex.adShowing && !this._platformPaused) Audio.unmute();
    });
    window.addEventListener('blur',()=>{
      Audio.mute();
      if (this.state==='racing' || this.state==='countdown') this.pause();
    });
    window.addEventListener('focus',()=>{
      if (!Yandex.adShowing && !this._platformPaused && !document.hidden) Audio.unmute();
    });
  },

  setAdPaused(v){this._adPaused=v;},
  setPlatformPaused(v){
    this._platformPaused = v;
    if (v){
      if (this.state==='racing' || this.state==='countdown'){
        this._pausedState = this.state;this.state = 'paused';
      }
    } else if (this.state==='paused' && this._pausedState) this.state = this._pausedState;
  },

  resize(){
    const w = window.innerWidth, h = window.innerHeight;
    this.viewW = w; this.viewH = h;
    this.canvas.width = w*this.dpr; this.canvas.height = h*this.dpr;
    this.canvas.style.width = w+'px'; this.canvas.style.height = h+'px';
  },

  startTrack(trackIdx, mode) {
    Audio.init(); Audio.resume();
    this.trackIdx = trackIdx;
    this.mode = mode || 'single';
    this.isMulti = this.mode==='multi' || this.mode==='online-host' || this.mode==='online-guest';
    this.isOnline = this.mode==='online-host' || this.mode==='online-guest';
    this.isHost = this.mode==='online-host';
    this.isGuest = this.mode==='online-guest';
    Input.multiMode = this.mode==='multi' || this.isOnline;

    this.track = new Track(TRACKS[trackIdx]);
    Ambient.reset(this.track.theme);

    const start = this.track.getStart();
    const a = start.angle;
    const c = Math.cos(a), s = Math.sin(a);
    const nx = -s, ny = c;

    const playerCar = getCarDef(Save.data.currentCar);
    const p2Car = getCarDef('lightning');
    const aiCars = [getCarDef('tank'), getCarDef('dragon')];

    const grid = [
      {back:100, side: 60},
      {back:100, side:-60},
      {back: 35, side: 60},
      {back: 35, side:-60},
    ];

    this.cars = [];

    // P1 (хост или одиночный игрок)
    {
      const g = grid[0];
      const x = start.x + c*g.back + nx*g.side;
      const y = start.y + s*g.back + ny*g.side;
      const car = new Car(x, y, a, true, false, 'Вы', 1, playerCar);
      const proj = this.track.project(car.x, car.y);
      car.progress = car.prevProgress = proj.progress;
      this.cars.push(car);
    }

    // P2 или AI
    if (this.mode==='multi' || this.mode==='online-host') {
      const g = grid[1];
      const x = start.x + c*g.back + nx*g.side;
      const y = start.y + s*g.back + ny*g.side;
      const car = new Car(x, y, a, true, true, 'Игрок 2', 2, p2Car);
      const proj = this.track.project(car.x, car.y);
      car.progress = car.prevProgress = proj.progress;
      this.cars.push(car);
    } else if (this.mode==='online-guest') {
      // Сначала хост-заглушка, потом гость
      const gHost = grid[0];
      const hostCar = new Car(
        start.x + c*gHost.back + nx*gHost.side,
        start.y + s*gHost.back + ny*gHost.side,
        a, false, false, 'Хост', 1, p2Car
      );
      const projH = this.track.project(hostCar.x, hostCar.y);
      hostCar.progress = hostCar.prevProgress = projH.progress;
      this.cars.push(hostCar);

      const gGuest = grid[1];
      const guestCar = new Car(
        start.x + c*gGuest.back + nx*gGuest.side,
        start.y + s*gGuest.back + ny*gGuest.side,
        a, true, true, 'Вы', 2, playerCar
      );
      const projG = this.track.project(guestCar.x, guestCar.y);
      guestCar.progress = guestCar.prevProgress = projG.progress;
      this.cars.push(guestCar);
    } else {
      const g = grid[1];
      const x = start.x + c*g.back + nx*g.side;
      const y = start.y + s*g.back + ny*g.side;
      const def = aiCars[0];
      const car = new Car(x, y, a, false, false, 'ИИ-1', 2, def);
      const proj = this.track.project(car.x, car.y);
      car.progress = car.prevProgress = proj.progress;
      this.cars.push(car);
    }

    // Остальные AI
    for (let i = 2; i < 4; i++){
      const g = grid[i];
      const x = start.x + c*g.back + nx*g.side;
      const y = start.y + s*g.back + ny*g.side;
      const def = aiCars[i-1] || aiCars[0];
      const car = new Car(x, y, a, false, false, 'ИИ-'+(i-1), i+1, def);
      const proj = this.track.project(car.x, car.y);
      car.progress = car.prevProgress = proj.progress;
      this.cars.push(car);
    }

    // Кто наш игрок для камеры/HUD
    this.player = this.isGuest ? this.cars[1] : this.cars[0];
    this.player2 = (this.mode==='multi' || this.mode==='online-host') ? this.cars[1] : null;

    this.camera.x = this.player.x;
    this.camera.y = this.player.y;
    this.camera.zoom = 1;

    this.countdown = 3.5;
    this.raceTime = 0;
    this.finishDelay = 0;
    this._lastCountShown = -1;
    this._shake = 0;
    this._lastReward = 0;
    this._inputTimer = 0;
    this._snapshotTimer = 0;
    Particles.clear();

    this.state = 'countdown';
    Input.showTouch(true);
    UI.hide();
  },

  restart(){
    if (this.isGuest) return;
    if (this.isHost) Online.send({t:'restart', trackIdx:this.trackIdx});
    this.startTrack(this.trackIdx, this.mode);
  },

  pause(){
    if (this.state!=='racing' && this.state!=='countdown') return;
    this._pausedState = this.state;
    this.state = 'paused';
    Input.showTouch(false);
    UI.showPause();
  },
  resume(){
    this.state = this._pausedState || 'racing';
    Input.showTouch(true);
    UI.hide();
  },

  update(dt){
    this._time += dt;
    if (this.track) Ambient.update(dt, this.track.theme);
    if (this._adPaused || this._platformPaused) return;

    // ============ ГОСТЬ ============
    if (this.isGuest) {
      this._inputTimer -= dt;
      if (this._inputTimer <= 0) {
        this._inputTimer = 1/30;
        Online.send({
          t: 'input',
          throttle: Input.throttle,
          brake: Input.brake,
          steer: Input.steer,
          handbrake: Input.handbrake,
        });
      }

      this.updatePlaces();

      // Отсчёт
      if (this.state === 'countdown') {
        this.countdown -= dt;
        const n = Math.ceil(this.countdown);
        if (n !== this._lastCountShown && n >= 0) {
          this._lastCountShown = n;
          if (n <= 3) Audio.countdown(n);
        }
        if (this.countdown <= 0) this.state = 'racing';
      }
      if (this.state === 'racing') this.raceTime += dt;

      // Реагируем на финиш из снапшота
      if (this.state === 'racing' && this.cars.some(c => c.finished)) {
        this.state = 'finished';
        this.finishDelay = 1.5;
        Audio.finish();
      }
      if (this.state === 'finished') {
        this.finishDelay -= dt;
        if (this.finishDelay <= 0) {
          this.state = 'results';
          Input.showTouch(false);
          this.handleResults();
        }
      }

      // Камера
      const p = this.player;
      const tx = p.x + Math.cos(p.angle)*40;
      const ty = p.y + Math.sin(p.angle)*40;
      const k = 1 - Math.exp(-6*dt);
      this.camera.x = lerp(this.camera.x, tx, k);
      this.camera.y = lerp(this.camera.y, ty, k);
      this.camera.zoom = lerp(this.camera.zoom, 1, k);

      if (this._shake > 0) this._shake = Math.max(0, this._shake - dt*3);
      return;
    }

    // ============ ХОСТ И ЛОКАЛЬНЫЕ ============
    if (this.state === 'countdown'){
      this.countdown -= dt;
      const n = Math.ceil(this.countdown);
      if (n !== this._lastCountShown && n >= 0){
        this._lastCountShown = n;
        if (n <= 3) Audio.countdown(n);
      }
      if (this.countdown <= 0) this.state = 'racing';
    }
    if (this.state === 'racing') this.raceTime += dt;

    if (this.state === 'racing' || this.state === 'countdown'){
      for (const car of this.cars){
        if (car.finished) continue;
        let throttle=0,brake=0,steer=0,handbrake=false;
        if (this.state === 'racing'){
          if (car.isPlayer && !car.isPlayer2){
            throttle = Input.throttle;brake = Input.brake;steer = Input.steer;handbrake = Input.handbrake;
          } else if (car.isPlayer2 && this.mode === 'multi'){
            throttle = Input.throttle2;brake = Input.brake2;steer = Input.steer2;handbrake = Input.handbrake2;
          } else if (car.isPlayer2 && this.isHost){
            throttle = Online.remoteInput.throttle;
            brake = Online.remoteInput.brake;
            steer = Online.remoteInput.steer;
            handbrake = Online.remoteInput.handbrake;
          } else {
            const cmd = AI.think(car, dt, this.track, this);
            throttle = cmd.throttle;brake = cmd.brake;steer = cmd.steer;
          }
        }
        car.update(dt, throttle, brake, steer, handbrake, this.track);
        this.resolveObstacles(car, dt);
        if (Math.abs(steer)>0.5 && car.speed>200 && Math.random()<0.4){
          Particles.add(car.x-Math.cos(car.angle)*12, car.y-Math.sin(car.angle)*12,
            rand(-25,25), rand(-25,25), 0.45, 'rgba(200,200,200,0.65)', 3);
        }
      }
      for (let i=0;i<this.cars.length;i++)
        for (let j=i+1;j<this.cars.length;j++)
          this.resolveCarCollision(this.cars[i], this.cars[j]);
    }

    for (const o of this.track.obstacles){
      if (o.type==='boost' && o._used){
        o._respawn -= dt;
        if (o._respawn <= 0) o._used = false;
      }
    }

    Particles.update(dt);
    this.updatePlaces();

    if (this.state === 'racing'){
      if (this.mode === 'multi' || this.mode === 'online-host'){
        if (!this.cars[0].finished && this.cars[0].lap >= this.track.laps){
          this.cars[0].finished = true;this.cars[0].finishTime = this.raceTime;this.onFinish();
        } else if (this.cars[1] && !this.cars[1].finished && this.cars[1].lap >= this.track.laps){
          this.cars[1].finished = true;this.cars[1].finishTime = this.raceTime;this.onFinish();
        }
      } else if (!this.player.finished && this.player.lap >= this.track.laps){
        this.player.finished = true;this.player.finishTime = this.raceTime;this.onFinish();
      }
    }

    if (this.state === 'finished'){
      this.finishDelay -= dt;
      if (this.finishDelay <= 0){
        this.state = 'results';
        Input.showTouch(false);
        this.handleResults();
      }
    }

    // Хост: отправка снапшотов
    if (this.isHost){
      this._snapshotTimer -= dt;
      if (this._snapshotTimer <= 0){
        this._snapshotTimer = 1/30;
        const snap = this.cars.map(c=>({
          x: Math.round(c.x*10)/10,
          y: Math.round(c.y*10)/10,
          a: Math.round(c.angle*100)/100,
          vx: Math.round(c.vx),
          vy: Math.round(c.vy),
          lap: c.lap,
          prog: Math.round(c.progress*1000)/1000,
          fin: c.finished,
          ft: c.finishTime,
        }));
        Online.send({t:'snap', cars:snap, rt:this.raceTime});
      }
    }

    // Камера
    if (this.mode === 'multi' && this.cars[1]){
      const midX = (this.cars[0].x + this.cars[1].x)/2;
      const midY = (this.cars[0].y + this.cars[1].y)/2;
      const k = 1 - Math.exp(-6*dt);
      this.camera.x = lerp(this.camera.x, midX, k);
      this.camera.y = lerp(this.camera.y, midY, k);
      const d = dist(this.cars[0].x, this.cars[0].y, this.cars[1].x, this.cars[1].y);
      const targetZoom = clamp(900/(d+500), 0.55, 1.0);
      this.camera.zoom = lerp(this.camera.zoom, targetZoom, k);
    } else {
      const p = this.player;
      const tx = p.x + Math.cos(p.angle)*40;
      const ty = p.y + Math.sin(p.angle)*40;
      const k = 1 - Math.exp(-6*dt);
      this.camera.x = lerp(this.camera.x, tx, k);
      this.camera.y = lerp(this.camera.y, ty, k);
      this.camera.zoom = lerp(this.camera.zoom, 1, k);
    }

    if (this._shake > 0) this._shake = Math.max(0, this._shake - dt*3);
  },

  applySnapshot(carsData, hostTime){
    if (!this.isGuest) return;
    for (let i=0;i<carsData.length && i<this.cars.length;i++){
      const cd = carsData[i], car = this.cars[i];
      car.x = cd.x;car.y = cd.y;car.angle = cd.a;
      car.vx = cd.vx || 0;car.vy = cd.vy || 0;
      car.lap = cd.lap;car.progress = cd.prog;
      car.finished = cd.fin;car.finishTime = cd.ft;
    }
    // Плавная синхронизация времени
    if (typeof hostTime === 'number'){
      this.raceTime = this.raceTime * 0.8 + hostTime * 0.2;
    }
    this.updatePlaces();
  },

  resolveObstacles(car, dt){
    for (const o of this.track.obstacles){
      if (o._used) continue;
      const dx = car.x-o.x, dy = car.y-o.y;
      const d = Math.hypot(dx,dy);
      if (o.type === 'boost'){
        if (d < o.r + CAR_R*0.5){
          o._used = true;o._respawn = 4;car.boostTime = 1.2;
          Particles.burst(o.x,o.y,'#ffe066',12,200);
          if (car.isPlayer) Audio.boost();
        }
        continue;
      }
      if (o.type === 'oil'){
        if (d < o.r){const k = Math.exp(-o.drag*dt);car.vx*=k;car.vy*=k;}
        continue;
      }
      const minD = CAR_R + o.r;
      if (d < minD && d > 0.01){
        const nx = dx/d, ny = dy/d;
        const overlap = minD - d;
        car.x += nx*overlap;car.y += ny*overlap;
        const vn = car.vx*nx + car.vy*ny;
        if (vn < 0){
          car.vx -= vn*nx*o.bounce;car.vy -= vn*ny*o.bounce;
          if (car.isPlayer){this._shake = Math.min(1,this._shake+0.15);Audio.hit();}
          Particles.burst(car.x,car.y,o.type==='barrel'?'#ff8c00':'#aaa',5,130);
        }
      }
    }
  },

  resolveCarCollision(a,b){
    const dx = b.x-a.x, dy = b.y-a.y;
    const d = Math.hypot(dx,dy);
    const minD = CAR_R*2;
    if (d >= minD || d < 0.01) return;
    const nx = dx/d, ny = dy/d;
    const totalW = a.weight + b.weight;
    const overlap = minD - d;
    a.x -= nx*overlap*(b.weight/totalW);a.y -= ny*overlap*(b.weight/totalW);
    b.x += nx*overlap*(a.weight/totalW);b.y += ny*overlap*(a.weight/totalW);
    const rvx = b.vx-a.vx, rvy = b.vy-a.vy;
    const vn = rvx*nx + rvy*ny;
    if (vn < 0){
      const imp = -vn*0.7;
      a.vx -= nx*imp*(b.weight/totalW);a.vy -= ny*imp*(b.weight/totalW);
      b.vx += nx*imp*(a.weight/totalW);b.vy += ny*imp*(a.weight/totalW);
      if (a.isPlayer || b.isPlayer){this._shake = Math.min(1,this._shake+0.2);Audio.hit();}
      Particles.burst((a.x+b.x)/2,(a.y+b.y)/2,'#ffcc44',6,150);
    }
  },

  updatePlaces(){
    const sorted = [...this.cars].sort((a,b)=>{
      if (a.finished !== b.finished) return a.finished ? -1 : 1;
      return b.getRaceProgress() - a.getRaceProgress();
    });
    sorted.forEach((c,i)=>c.place = i+1);
  },

  onFinish(){
    this.state = 'finished';
    this.finishDelay = 1.5;
    Audio.finish();
    if (!this.isOnline) Yandex.showFullscreenAd();
  },

  handleResults(){
    const p = this.player;
    const isRecord = !this.isMulti && !this.isOnline && Save.setBest(this.trackIdx, p.finishTime);
    if (!this.isMulti && !this.isOnline && p.place === 1) Save.unlock(this.trackIdx);
    let reward = 0;
    if (!this.isMulti && !this.isOnline){
      const rewardTable = [150,75,30,15];
      reward = rewardTable[p.place-1] || 15;
      if (isRecord) reward += 50;
      Save.data.coins += reward;
      Save.save();
    }
    this._lastReward = reward;
    UI.showResults(isRecord, reward);
  },

  draw(){
    const ctx = this.ctx;
    ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    const theme = this.track ? this.track.theme : THEMES.meadow;
    ctx.fillStyle = theme.bg;
    ctx.fillRect(0,0,this.viewW,this.viewH);
    if (!this.track) return;
    const scale = clamp(Math.min(this.viewW,this.viewH)/1000,0.45,1.15) * this.camera.zoom;
    const shakeX = this._shake>0 ? rand(-1,1)*this._shake*8 : 0;
    const shakeY = this._shake>0 ? rand(-1,1)*this._shake*8 : 0;
    ctx.save();
    ctx.translate(this.viewW/2+shakeX, this.viewH/2+shakeY);
    ctx.scale(scale,scale);
    ctx.translate(-this.camera.x, -this.camera.y);
    const halfW = this.viewW/(2*scale)+250;
    const halfH = this.viewH/(2*scale)+250;
    const viewL = this.camera.x-halfW, viewR = this.camera.x+halfW;
    const viewT = this.camera.y-halfH, viewB = this.camera.y+halfH;
    this.drawBgPattern(ctx,viewL,viewR,viewT,viewB);
    this.drawDecor(ctx,viewL,viewR,viewT,viewB);
    this.drawTrack(ctx);
    this.drawObstacles(ctx);
    Particles.draw(ctx);
    for (const car of this.cars) car.draw(ctx);
    ctx.restore();
    Ambient.draw(ctx);
    this.drawHUD(ctx);
  },

  drawBgPattern(ctx,left,right,top,bottom){
    const theme = this.track.theme;
    const step = 70;
    const sx = Math.floor(left/step)*step;
    const sy = Math.floor(top/step)*step;
    ctx.fillStyle = theme.bg2;
    for (let y=sy;y<bottom;y+=step){
      for (let x=sx;x<right;x+=step){
        ctx.beginPath();ctx.arc(x+30,y+45,2.5,0,TAU);ctx.fill();
        if ((x/step+y/step)%3===0){ctx.beginPath();ctx.arc(x+60,y+20,1.8,0,TAU);ctx.fill();}
      }
    }
    if (theme === 'night'){
      const rng = seededRand(Math.floor((left+top)*0.01));
      ctx.fillStyle = 'rgba(255,220,120,0.04)';
      for (let i=0;i<12;i++){
        const x = left+rng()*(right-left), y = top+rng()*(bottom-top);
        ctx.beginPath();ctx.arc(x,y,60+rng()*40,0,TAU);ctx.fill();
      }
    }
  },

  drawDecor(ctx,left,right,top,bottom){
    const t = this._time;
    for (const d of this.track.decor){
      if (d.x<left || d.x>right || d.y<top || d.y>bottom) continue;
      drawDecorItem(ctx,d,t);
    }
  },

  drawTrack(ctx){
    const track = this.track;
    const path = track.getPath2D();
    ctx.lineCap = 'round';ctx.lineJoin = 'round';
    ctx.save();ctx.translate(4,5);
    ctx.strokeStyle = 'rgba(0,0,0,0.32)';
    ctx.lineWidth = track.roadWidth+26;
    ctx.stroke(path);
    ctx.restore();
    ctx.strokeStyle = '#8a4a2a';
    ctx.lineWidth = track.roadWidth+26;
    ctx.stroke(path);
    ctx.save();
    ctx.setLineDash([22,22]);
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#c0392b';
    ctx.stroke(path);
    ctx.restore();
    ctx.strokeStyle = '#4a4a4a';
    ctx.lineWidth = track.roadWidth;
    ctx.stroke(path);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = track.roadWidth-40;
    ctx.stroke(path);
    ctx.strokeStyle = 'rgba(255,230,100,0.5)';
    ctx.lineWidth = 4;
    ctx.setLineDash([30,30]);
    ctx.stroke(path);
    ctx.setLineDash([]);
    // Финиш
    const start = track.getStart();
    const W = track.roadWidth;
    ctx.save();
    ctx.translate(start.x,start.y);
    ctx.rotate(start.angle);
    const cell = 24;
    const lineHalf = 2*cell;
    const rows = Math.ceil(W/cell);
    for (let r=0;r<rows;r++)for (let c=0;c<4;c++){
      const dark = (r+c)%2===0;
      ctx.fillStyle = dark ? '#101010' : '#f8f8f8';
      ctx.fillRect(-lineHalf+c*cell, -W/2+r*cell, cell, cell);
    }
    ctx.fillStyle = '#fff';
    ctx.fillRect(-lineHalf-3,-W/2,3,W);
    ctx.fillRect(lineHalf,-W/2,3,W);
    ctx.restore();
    // Плашка
    const perpX = -Math.sin(start.angle), perpY = Math.cos(start.angle);
    const labelOffset = W/2+45;
    const lx = start.x - perpX*labelOffset;
    const ly = start.y - perpY*labelOffset;
    ctx.save();
    ctx.translate(lx,ly);
    ctx.fillStyle = 'rgba(0,0,0,0.78)';
    roundRect(ctx,-52,-18,104,36,8);ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1.5;ctx.stroke();
    ctx.font = '22px system-ui';
    ctx.textAlign = 'center';ctx.textBaseline = 'middle';
    ctx.fillText('🏁',-32,0);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px system-ui';
    ctx.fillText('ФИНИШ',8,0);
    ctx.textAlign = 'left';ctx.textBaseline = 'alphabetic';
    ctx.restore();
  },

  drawObstacles(ctx){
    for (const o of this.track.obstacles){
      if (o._used) continue;
      ctx.save();
      ctx.translate(o.x,o.y);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();ctx.ellipse(3,4,o.r,o.r*0.9,0,0,TAU);ctx.fill();
      if (o.type === 'cone'){
        ctx.fillStyle = '#c05818';
        ctx.beginPath();ctx.moveTo(0,-o.r-4);ctx.lineTo(-o.r,o.r);ctx.lineTo(o.r,o.r);ctx.closePath();ctx.fill();
        ctx.fillStyle = '#e67e22';
        ctx.beginPath();ctx.moveTo(-1.5,-o.r-3);ctx.lineTo(-o.r+2,o.r-2);ctx.lineTo(o.r-2,o.r-2);ctx.closePath();ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();ctx.moveTo(-o.r*0.35,-o.r*0.15);ctx.lineTo(o.r*0.35,-o.r*0.15);ctx.lineTo(o.r*0.48,o.r*0.12);ctx.lineTo(-o.r*0.48,o.r*0.12);ctx.closePath();ctx.fill();
        ctx.fillStyle = '#a04818';
        roundRect(ctx,-o.r,o.r-5,o.r*2,6,2);ctx.fill();
      } else if (o.type === 'tire'){
        ctx.fillStyle = '#0a0a0a';ctx.beginPath();ctx.arc(0,0,o.r,0,TAU);ctx.fill();
        ctx.strokeStyle = '#2a2a2a';ctx.lineWidth = 3;
        ctx.beginPath();ctx.arc(0,0,o.r-3,0,TAU);ctx.stroke();
        ctx.strokeStyle = '#0a0a0a';ctx.lineWidth = 2.5;
        for (let i=0;i<12;i++){
          const a = i*TAU/12;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a)*o.r*0.72,Math.sin(a)*o.r*0.72);
          ctx.lineTo(Math.cos(a)*o.r,Math.sin(a)*o.r);
          ctx.stroke();
        }
        ctx.fillStyle = '#888';ctx.beginPath();ctx.arc(0,0,o.r*0.45,0,TAU);ctx.fill();
        ctx.fillStyle = '#aaa';ctx.beginPath();ctx.arc(0,0,o.r*0.4,0,TAU);ctx.fill();
        ctx.fillStyle = '#333';ctx.beginPath();ctx.arc(0,0,o.r*0.15,0,TAU);ctx.fill();
      } else if (o.type === 'barrel'){
        const g = ctx.createRadialGradient(-o.r*0.4,-o.r*0.4,2,0,0,o.r);
        g.addColorStop(0,'#e05040');g.addColorStop(1,'#8a2018');
        ctx.fillStyle = g;ctx.beginPath();ctx.arc(0,0,o.r,0,TAU);ctx.fill();
        ctx.fillStyle = '#f5f5f5';
        ctx.beginPath();ctx.arc(0,0,o.r*0.9,0,TAU);ctx.arc(0,0,o.r*0.72,0,TAU,true);ctx.fill();
        ctx.strokeStyle = '#3a0f0a';ctx.lineWidth = 2;
        ctx.beginPath();ctx.arc(0,0,o.r,0,TAU);ctx.stroke();
        ctx.fillStyle = '#7a2018';
        ctx.beginPath();ctx.arc(0,0,o.r*0.35,0,TAU);ctx.fill();
      } else if (o.type === 'oil'){
        const g = ctx.createRadialGradient(0,0,o.r*0.2,0,0,o.r);
        g.addColorStop(0,'rgba(10,8,5,0.95)');
        g.addColorStop(0.6,'rgba(35,25,10,0.8)');
        g.addColorStop(1,'rgba(30,20,10,0)');
        ctx.fillStyle = g;ctx.beginPath();ctx.arc(0,0,o.r,0,TAU);ctx.fill();
        const colors = ['rgba(120,80,200,0.5)','rgba(255,200,60,0.45)','rgba(80,220,180,0.45)'];
        for (let i=0;i<3;i++){
          ctx.strokeStyle = colors[i];ctx.lineWidth = 3;
          ctx.beginPath();ctx.arc(0,0,o.r*(0.25+i*0.15),0.3+i*1.1,2.3+i*1.1);ctx.stroke();
        }
      } else if (o.type === 'boost'){
        const pulse = 0.7+0.3*Math.sin(performance.now()/120);
        ctx.globalAlpha = pulse*0.55;
        ctx.fillStyle = 'rgba(255,220,80,0.7)';
        ctx.beginPath();ctx.arc(0,0,o.r*1.8,0,TAU);ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(255,220,80,0.35)';
        ctx.beginPath();ctx.arc(0,0,o.r*1.3,0,TAU);ctx.fill();
        ctx.fillStyle = '#f1c40f';ctx.strokeStyle = '#8a6a00';ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-o.r*0.85,-o.r*0.7);ctx.lineTo(-o.r*0.05,0);ctx.lineTo(-o.r*0.85,o.r*0.7);
        ctx.lineTo(-o.r*0.45,o.r*0.7);ctx.lineTo(o.r*0.35,0);ctx.lineTo(-o.r*0.45,-o.r*0.7);
        ctx.closePath();ctx.fill();ctx.stroke();
      }
      ctx.restore();
    }
  },

  drawHUD(ctx){
    if (!this.player) return;
    ctx.save();
    if (this.mode === 'multi' && this.cars[1]) {
      this._drawPlayerHUD(ctx,this.cars[0],12,'#e74c3c','P1');
      this._drawPlayerHUD(ctx,this.cars[1],this.viewW-252,'#3498db','P2');
    } else if (this.isOnline) {
      this._drawPlayerHUD(ctx,this.player,12,'#7ee8a2',this.isHost?'ВЫ (хост)':'ВЫ (гость)');
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      roundRect(ctx,12,152,240,32,10);ctx.fill();
      ctx.fillStyle = Online.connected ? '#7ee8a2' : '#ff7676';
      ctx.font = 'bold 13px system-ui';
      ctx.textAlign = 'left';ctx.textBaseline = 'middle';
      ctx.fillText(Online.connected ? '● Онлайн' : '○ Отключено',24,168);
    } else {
      this._drawPlayerHUD(ctx,this.player,12,'#e74c3c','');
    }
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(ctx,this.viewW/2-70,12,140,36,10);ctx.fill();
    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 18px system-ui';
    ctx.textAlign = 'center';ctx.textBaseline = 'middle';
    ctx.fillText(`💰 ${Save.data.coins}`,this.viewW/2,31);
    if (this.state === 'countdown'){
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(0,0,this.viewW,this.viewH);
      const n = Math.ceil(this.countdown);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 160px system-ui';
      ctx.textAlign = 'center';ctx.textBaseline = 'middle';
      ctx.fillText(n>0?String(n):'GO!',this.viewW/2,this.viewH/2);
    }
    ctx.restore();
  },

  _drawPlayerHUD(ctx,player,x,borderColor,label){
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(ctx,x,12,240,130,12);ctx.fill();
    ctx.strokeStyle = borderColor;ctx.lineWidth = 2;
    roundRect(ctx,x,12,240,130,12);ctx.stroke();
    const curLap = Math.min(player.lap+1, this.track.laps);
    ctx.fillStyle = borderColor;
    ctx.font = 'bold 14px system-ui';
    ctx.textAlign = 'left';ctx.textBaseline = 'top';
    if (label) ctx.fillText(label, x+12, 20);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 15px system-ui';
    ctx.fillText(`Круг: ${curLap}/${this.track.laps}`, x+12, 40);
    ctx.font = 'bold 26px system-ui';
    ctx.fillStyle = player.place === 1 ? '#f1c40f' : '#fff';
    ctx.fillText(`${player.place}/${this.cars.length}`, x+12, 62);
    ctx.font = '13px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText(this.track.name, x+12, 96);
    ctx.font = '14px system-ui';
    ctx.fillText(`${this.raceTime.toFixed(2)} с`, x+12, 112);
    const barW = 216, barH = 6;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    roundRect(ctx,x+12,132,barW,barH,3);ctx.fill();
    ctx.fillStyle = player.speed > player.maxSpeedVal*0.9 ? '#ff7676' : '#7ee8a2';
    roundRect(ctx,x+12,132,barW*clamp(player.speed/player.maxSpeedVal,0,1),barH,3);ctx.fill();
  },
};

const UI = {
  el: null,
  init(){
    this.el = document.getElementById('ui');
    this.el.addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      this.handle(btn.dataset.action);
    });
    this.el.addEventListener('input', e => {
      if (e.target && e.target.classList.contains('codeInput')) {
        e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
      }
    });
  },
  show(html){
    this.el.classList.add('active');
    this.el.innerHTML = `<div class="panel">${html}</div>`;
  },
  hide(){
    this.el.classList.remove('active');
    this.el.innerHTML = '';
  },
  handle(action){
    if (action === 'menu') {
      Online.cleanup();
      return this.showMenu();
    }
    if (action === 'campaign') return this.showCampaign();
    if (action === 'shop') return this.showShop();
    if (action === 'online') {
      Online.cleanup();
      return this.showOnline();
    }
    if (action === 'online-host') return this.hostGame();
    if (action === 'online-join') return this.joinGame();
    if (action === 'do-join') return this.doJoin();
    if (action === 'resume') return Game.resume();
    if (action === 'restart') return Game.restart();
    if (action === 'rewarded') return this.onRewardedClick();
    if (action === 'quick1') {
      const idx = Math.min(Save.data.unlocked-1, Math.floor(Math.random()*Save.data.unlocked));
      return Game.startTrack(idx, 'single');
    }
    if (action === 'quick2') {
      const idx = Math.min(Save.data.unlocked-1, Math.floor(Math.random()*Save.data.unlocked));
      return Game.startTrack(idx, 'multi');
    }
    if (action === 'cancel-online') {
      Online.cleanup();
      return this.showOnline();
    }
    if (action === 'nextTrack') {
      const next = Game.trackIdx+1;
      if (next < TRACKS.length) return Game.startTrack(next, Game.mode);
      return this.showCampaign();
    }
    if (action === 'copy-code') {
      const code = Online.roomCode;
      if (code) {
        try { navigator.clipboard.writeText(code); } catch(e){}
        const el = document.querySelector('.codeDisplay');
        if (el) { el.textContent = '✓ Скопировано'; setTimeout(() => { if (el) el.textContent = code; }, 900); }
      }
      return;
    }
    if (action.startsWith('track:')) {
      const parts = action.split(':');
      const idx = parseInt(parts[1]);
      if (!Number.isInteger(idx) || idx < 0 || idx >= TRACKS.length) return;
      if (idx >= Save.data.unlocked) return;
      return Game.startTrack(idx, 'single');
    }
    if (action.startsWith('online-track:')) {
      const idx = parseInt(action.split(':')[1]);
      if (!Number.isInteger(idx) || idx < 0 || idx >= TRACKS.length) return;
      if (idx >= Save.data.unlocked) return;
      return this.hostChooseTrack(idx);
    }
    if (action.startsWith('car:')) return this.handleCar(action.split(':')[1]);
  },
  handleCar(id){
    const car = getCarDef(id);
    if (!car || car.id !== id) return;
    const s = Save.data;
    if (s.ownedCars.includes(id)){
      s.currentCar = id; Save.save();
      Audio.beep(660,0.1,'sine',0.15);
      this.showShop();return;
    }
    if (s.coins >= car.price){
      s.coins -= car.price;
      s.ownedCars.push(id);s.currentCar = id;
      Save.save();Audio.buy();
      this.showShop();
    } else {
      Audio.beep(200,0.2,'square',0.2);
    }
  },
  showDisconnectNotice(){
    Game.state = 'menu';
    this.show(`
      <div class="title" style="font-size:32px;color:#ff7676">СОЕДИНЕНИЕ ПОТЕРЯНО</div>

  },
  showMenu(){

  hostGame(){

      <div class="title" style="font-size:32px">ВЫБОР ТРАССЫ</div>

  joinGame(){

      <div class="title" style="font-size:28px">ВОЙТИ В ИГРУ</div>
      <div class="subtitle">Введите 6-символьный код</div>

  doJoin(){

  showResults(isRecord, reward){

    const medals = ['🥇','🥈','🥉','4️⃣'];
    const won = place === 1;
    const isLast = Game.trackIdx >= TRACKS.length-1;
    let titleHTML = '';
    if (Game.mode === 'multi' && Game.cars[1]){

      titleHTML = `<div class="title" style="font-size:32px">ПОБЕДА: ${winner}</div>`;

    let btns = '';

      btns = '<button class="btn primary" data-action="menu">⌂ В меню</button>';

      if (won && !isLast && !Game.isMulti) btns += '<button class="btn primary" data-action="nextTrack">▶ Следующая трасса</button>';
      btns += '<button class="btn" data-action="restart">↻ Ещё раз</button>';
      btns += '<button class="btn" data-action="menu">⌂ В меню</button>';
    }
    this.show(`
      ${titleHTML}
      <div class="stat"><span>Трасса:</span><b>${Game.track.name}</b></div>
      <div class="stat"><span>Время:</span><b>${time} с${isRecord?' 🏆':''}</b></div>
      <div class="stat"><span>Круги:</span><b>${Game.track.laps}</b></div>

      <div class="coinBar">${Save.data.coins}</div>
      ${won && !isLast && !Game.isMulti && !Game.isOnline ? '<div class="subtitle" style="color:#7ee8a2;margin-top:10px">🔓 Открыта новая трасса!</div>' : ''}
      ${btns}
    `);
  },
  onRewardedClick(){
    Yandex.showRewardedAd(rewarded => {
      if (rewarded){
        Save.data.coins += 200;
        Save.save();
        alert('Спасибо! Получено 💰 200 монет.');
        this.showMenu();
      } else {
        alert('Реклама не была показана. Попробуйте позже.');
      }
    });
  },
};

// ============================================================
// BOOT + LOOP
// ============================================================
let _lastT = 0;
function loop(now){
  const dt = Math.min(0.05, (now-(_lastT||now))/1000);
  _lastT = now;
  const racingStates = ['racing','countdown','finished'];
  if (racingStates.includes(Game.state)) {
    Game.update(dt);
  } else if (Game.track){
    Game._time += dt;
    Ambient.update(dt, Game.track.theme);
  }
  if (Game.state !== 'menu' && Game.state !== 'campaign' && Game.state !== 'shop' && Game.state !== 'online'){
    Game.draw();
  } else {
    const ctx = Game.ctx;
    ctx.setTransform(Game.dpr,0,0,Game.dpr,0,0);
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0,0,Game.viewW,Game.viewH);
    // Сетчатый узор
    ctx.strokeStyle = 'rgba(80,120,180,0.06)';
    ctx.lineWidth = 1;
    for (let x = 0; x < Game.viewW; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, Game.viewH); ctx.stroke();
    }
    for (let y = 0; y < Game.viewH; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(Game.viewW, y); ctx.stroke();
    }
  }
  requestAnimationFrame(loop);
}

function boot(){
  try {
    Save.load();
    Game.init();
    UI.init();
    UI.showMenu();
    requestAnimationFrame(loop);
    Yandex.init();
    console.log('[Mini Racers] Ready. Трасс:', TRACKS.length, 'Машин:', CARS.length);
  } catch (e) {
    console.error('[Mini Racers] Boot failed', e);
    document.body.innerHTML = '<pre style="padding:20px;color:#f88;font:14px monospace;white-space:pre-wrap">Ошибка запуска:\n'+(e&&e.message)+'\n\n'+(e&&e.stack)+'</pre>';
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
